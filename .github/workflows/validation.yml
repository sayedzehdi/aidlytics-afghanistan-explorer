name: Validate Aidlytics Explorer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas openpyxl
      - run: python -m unittest discover -v -p 'test_*.py'
      - run: python -m py_compile app.py analytics.py
